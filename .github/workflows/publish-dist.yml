name: Publish dist

# `kedos-dist` is how this fork is consumed: it carries the built `dist`
# directories, which are gitignored on the source branches. Building it by hand
# is what left it stale and missing six of the eight packages, so it is built
# here instead.
on:
  push:
    branches: ['kedos']
  workflow_dispatch:

# The job rewrites kedos-dist.
permissions:
  contents: write

# Two runs racing would each force-push a different tree.
concurrency:
  group: publish-dist
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      # The `.wasm` binaries are committed, so this is TypeScript and file
      # copying only - no Docker, and no codec rebuild.
      - name: Build
        run: npm run build

      # A published dist that fails its own tests is worse than a stale one.
      - name: Integration tests
        run: cd test && npm install && npm test

      # The branch previously carried only jpeg and webp, which nothing caught.
      - name: Check every package produced a dist
        run: |
          set -euo pipefail
          missing=0
          for pkg in packages/*/; do
            if [ ! -d "${pkg}dist" ]; then
              echo "::error::$(basename "$pkg") produced no dist/"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Publish to kedos-dist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # kedos-dist is a function of its source commit: this tree, plus one
          # commit carrying the built output. Rebuilt from scratch each time
          # rather than accumulated, so it cannot drift from what built it.
          git checkout -B kedos-dist
          # dist is gitignored for development; here it is the entire point.
          git add -f packages/*/dist
          git commit -m "chore: build dist from ${GITHUB_SHA::12}" \
                     -m "Generated by .github/workflows/publish-dist.yml from ${GITHUB_REF_NAME}."
          git push --force origin kedos-dist
