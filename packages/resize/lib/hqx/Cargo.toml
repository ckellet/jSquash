[package]
name = "squooshhqx"
version = "0.1.0"
authors = ["Surma <surma@surma.link>"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-simd", "--no-validation"]

[lib]
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
cfg-if = "0.1.2"
wasm-bindgen = "0.2.38"
# lazy_static = "1.0.0"
hqx = {git = "https://github.com/CryZe/wasmboy-rs", tag="v0.1.3"}

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.2"

[profile.release]
# Unlike the other crates here, hqx does not repay aggressive optimisation:
# -O3 through wasm-opt inflated it from 132 KB to 465 KB for an 8% speedup on
# a path most callers never take. Kept size-optimised; measured with
# `npm run bench -- --filter resize`.
opt-level = "s"
lto = "fat"
codegen-units = 1
