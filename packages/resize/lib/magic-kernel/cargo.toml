[package]
name = "jsquash-magic-kernel"
version = "0.1.0"
authors = ["Jamie <jamsinclairnz@gmail.com>"]
edition = "2021"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--no-validation"]

[lib]
crate-type = ["cdylib"]

[dependencies]
magic-kernel = "0.1.1"
wasm-bindgen = "0.2.106"
js-sys = "0.3.83"
web-sys = { version = "0.3.83", features = ["ImageData"] }

[profile.release]
# These crates are compute bound, not size bound - the largest is a couple of
# hundred KB. opt-level = "s" was costing loop vectorisation and inlining in
# the hot pixel loops for a saving that does not matter here.
opt-level = 3
lto = "fat"
codegen-units = 1
